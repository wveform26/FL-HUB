<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08080c">
  <meta name="description" content="FL HUB — сообщество продюсеров FL Studio. Делись треками, проектами, инструментами, плагинами и драм-китами.">
  <title>FL HUB — сообщество продюсеров FL Studio</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
  <script>
    // Тема применяется до первой отрисовки, чтобы не было вспышки тёмного фона.
    (function () {
      var preference = "auto";
      try { preference = localStorage.getItem("flhub-theme") || "auto"; } catch (error) {}
      var wantsLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
      var theme = preference === "light" || preference === "dark"
        ? preference
        : (wantsLight ? "light" : "dark");
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      if (theme === "light") {
        document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f4f3f7");
      }
    })();
  </script>
  <link rel="stylesheet" href="/static/css/style.css">
  <script type="module" src="/static/js/app.js"></script>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <header class="site-header" id="site-header"></header>
  <main id="main" class="main"></main>
  <footer class="site-footer" id="site-footer"></footer>
  <div id="player-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>
  <noscript>
    <div style="padding:40px;text-align:center;font-family:sans-serif">
      Для работы FL HUB нужен JavaScript.
    </div>
  </noscript>
</body>
</html>
